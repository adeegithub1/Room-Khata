<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Room Khata</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = { theme: { extend: { colors: { primary: { 50: '#eff6ff', 100: '#dbeafe', 500: '#3b82f6', 600: '#2563eb', 700: '#1d4ed8' } } } } }
    </script>
    
    <style>
        @keyframes scaleFadeIn { from { opacity: 0; transform: scale(0.97) translateY(10px); } to { opacity: 1; transform: scale(1) translateY(0); } }
        @keyframes slideInRightFade { from { opacity: 0; transform: translateX(20px); } to { opacity: 1; transform: translateX(0); } }

        .view-section { display: none !important; }
        .view-section.view-active { display: block !important; width: 100%; height: 100%; animation: scaleFadeIn 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        
        ::-webkit-scrollbar { display: none; }
        body { background-color: #e5e7eb; display: flex; justify-content: center; align-items: center; min-height: 100dvh; margin: 0; font-family: 'Inter', sans-serif; }
        .app-container { width: 100%; height: 100dvh; background-color: #f9fafb; position: relative; overflow: hidden; }

        @media (min-width: 600px) {
            .app-container { max-width: 400px; height: 90vh; max-height: 850px; border-radius: 2.5rem; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.25); border: 8px solid #111827; }
        }

        .room-card-animate { opacity: 0; animation: slideInRightFade 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    </style>
</head>
<body>
    <div class="app-container">
        
        <div id="view-login" class="view-section bg-white overflow-y-auto">
            <div class="flex flex-col justify-center items-center min-h-full px-6 py-12">
                <div class="w-full max-w-sm text-center mt-8">
                    <div class="w-20 h-20 bg-gradient-to-tr from-blue-100 to-blue-50 rounded-full flex items-center justify-center mx-auto mb-6 shadow-lg hover:scale-105 transition-transform">
                        <i class="fa-solid fa-lock text-3xl text-blue-600"></i>
                    </div>
                    <h1 class="text-3xl font-bold text-gray-800 mb-2">Room Khata</h1>
                    <p class="text-gray-500 mb-8 font-medium">Owner Login - Secure your data</p>

                    <form id="auth-form" class="space-y-4" onsubmit="handleLoginSubmit(event)">
                        <div class="relative group">
                            <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-gray-400"><i class="fa-solid fa-envelope"></i></div>
                            <input type="email" id="auth-email" required class="w-full pl-11 pr-4 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:bg-white focus:ring-2 focus:ring-blue-500 outline-none" placeholder="Email Address">
                        </div>
                        <div class="relative group">
                            <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-gray-400"><i class="fa-solid fa-key"></i></div>
                            <input type="password" id="auth-password" required class="w-full pl-11 pr-4 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:bg-white focus:ring-2 focus:ring-blue-500 outline-none" placeholder="Password">
                        </div>
                        <button type="submit" class="w-full py-3.5 mt-2 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-xl shadow-lg active:scale-95 transition-all flex justify-center gap-2">
                            <span>Login Securely</span> <i class="fa-solid fa-arrow-right mt-1"></i>
                        </button>
                    </form>
                    <p class="mt-6 text-sm text-gray-500">New Owner? <button type="button" onclick="handleSignup()" class="text-blue-600 font-bold">Create Account</button></p>
                </div>
            </div>
        </div>

        <div id="view-owner" class="view-section relative overflow-hidden">
            <header class="bg-gradient-to-br from-primary-600 to-primary-700 text-white pt-12 pb-6 px-6 rounded-b-[2rem] shadow-lg z-10 shrink-0">
                <div class="flex justify-between items-center mb-6">
                    <div><p class="text-primary-100 text-sm font-medium">Good Morning,</p><h2 class="text-2xl font-bold">Owner</h2></div>
                </div>
                <div class="bg-white/10 backdrop-blur-md rounded-2xl p-4 border border-white/20 flex justify-between items-center">
                    <div><p class="text-primary-100 text-[10px] font-bold uppercase tracking-wider mb-1">Total Revenue</p><p class="text-2xl font-bold" id="total-revenue">₹0</p></div>
                    <div class="h-10 w-px bg-white/20"></div>
                    <div class="text-right"><p class="text-primary-100 text-[10px] font-bold uppercase tracking-wider mb-1">Pending</p><p class="text-2xl font-bold text-yellow-300" id="total-pending">₹0</p></div>
                </div>
            </header>
            <div class="h-full overflow-y-auto px-6 pt-6 pb-32">
                <div class="flex justify-between items-end mb-4"><h3 class="text-lg font-bold text-gray-800">Your Rooms</h3></div>
                <div id="room-list-home" class="space-y-3 pb-4"></div>
            </div>
            <nav class="absolute bottom-0 left-0 w-full bg-white/90 backdrop-blur-md border-t border-gray-200 px-6 py-4 flex justify-between items-center z-20">
                <button onclick="switchView('view-owner')" class="flex flex-col items-center text-primary-600 gap-1 w-1/4"><i class="fa-solid fa-house text-xl"></i><span class="text-[10px] font-bold">Home</span></button>
                <button onclick="switchView('view-add-room')" class="flex flex-col items-center text-gray-400 gap-1 w-1/4"><i class="fa-solid fa-plus text-xl"></i><span class="text-[10px] font-semibold">Add</span></button>
                <button onclick="handleLogout()" class="flex flex-col items-center text-gray-400 gap-1 w-1/4"><i class="fa-solid fa-right-from-bracket text-xl"></i><span class="text-[10px] font-semibold">Logout</span></button>
            </nav>
        </div>

        <div id="view-add-room" class="view-section bg-white overflow-y-auto">
            <div class="pt-12 pb-4 px-6 border-b border-gray-100 flex items-center gap-4">
                <button onclick="switchView('view-owner')" class="text-gray-400 active:scale-75"><i class="fa-solid fa-arrow-left text-xl"></i></button>
                <h2 class="text-xl font-bold text-gray-800">New Room</h2>
            </div>
            <div class="px-6 pb-12 pt-6 h-full">
                <form id="add-room-form" class="space-y-5" onsubmit="handleAddRoomSubmit(event)">
                    <div><label class="block text-sm font-semibold text-gray-700 mb-1.5">Room Number</label><input type="text" id="new-room-no" required class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl outline-none" placeholder="e.g. 103"></div>
                    <div><label class="block text-sm font-semibold text-gray-700 mb-1.5">Monthly Rent (₹)</label><input type="number" id="new-rent-amount" required class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl outline-none" placeholder="e.g. 7500"></div>
                    <button type="submit" class="w-full bg-primary-600 text-white font-bold py-3.5 rounded-xl mt-8">Save Room</button>
                </form>
            </div>
        </div>

        <div id="view-tenant-join" class="view-section bg-gradient-to-br from-green-50 to-white overflow-y-auto">
            <div class="flex flex-col justify-center items-center min-h-full px-6 py-12">
                <div class="w-full max-w-sm mt-8">
                    <div class="w-20 h-20 bg-green-100 rounded-full flex items-center justify-center mx-auto mb-6 shadow-lg">
                        <i class="fa-solid fa-house-user text-3xl text-green-600"></i>
                    </div>
                    <h1 class="text-2xl font-bold text-gray-800 text-center mb-2">Welcome to your Room!</h1>
                    <p class="text-gray-500 text-center mb-8 text-sm">Please fill your details to join the Khata.</p>

                    <div class="bg-white p-5 rounded-2xl shadow-sm border border-gray-100 mb-6">
                        <p class="text-xs text-gray-400 font-bold uppercase mb-1">Room Assingment</p>
                        <p class="text-lg font-bold text-gray-800" id="magic-room-display">Loading...</p>
                    </div>

                    <form id="magic-join-form" class="space-y-4" onsubmit="handleMagicJoinSubmit(event)">
                        <div><label class="block text-sm font-semibold text-gray-700 mb-1.5">Your Full Name</label><input type="text" id="magic-tenant-name" required class="w-full px-4 py-3 bg-white border border-gray-200 rounded-xl outline-none focus:border-green-500"></div>
                        <div><label class="block text-sm font-semibold text-gray-700 mb-1.5">WhatsApp Number</label><input type="tel" id="magic-tenant-phone" required class="w-full px-4 py-3 bg-white border border-gray-200 rounded-xl outline-none focus:border-green-500" placeholder="10 digits"></div>
                        <button type="submit" class="w-full py-3.5 mt-4 bg-green-600 hover:bg-green-700 text-white font-bold rounded-xl shadow-lg active:scale-95 transition-all">Join Room Khata</button>
                    </form>
                </div>
            </div>
        </div>

    </div>
    <script type="module" src="app.js"></script> 
</body>
</html>
